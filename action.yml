name: 'MainQuest'
description: 'Render your GitHub profile as an animated 16-bit JRPG status screen.'
author: 'Codestz'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  github_token:
    description: >-
      A personal access token. GITHUB_TOKEN will NOT work: its scope for
      user-level contribution queries does not return
      restrictedContributionsCount, so private work vanishes from the card.
      A fine-grained PAT with NO repository access and NO account permissions
      is sufficient and is the safest option — contribution counts are an
      attribute of the authenticated identity, not a resource, so there is no
      permission to grant. Verified: such a token returns the private count and
      the merged-PR search correctly.
    required: true
  username:
    description: 'GitHub login to render.'
    required: false
    default: ${{ github.repository_owner }}
  lang:
    description: >-
      RESERVED — not yet wired. The renderer currently emits English only.
      The es and pt-BR locale files ship complete and are validated against
      every text slot by the layout tests, but nothing loads them yet. Setting
      this has no effect today; it is kept so that workflows written now do
      not need editing when it lands.
    required: false
    default: 'en'
  outputs:
    description: 'Directory to write the SVG files into.'
    required: false
    default: 'dist'
  themes:
    description: 'Comma-separated: dark,light'
    required: false
    default: 'dark,light'
  motion:
    description: >-
      Comma-separated: animated,still. Applies to the status card only — the
      ability card has nothing to animate.
    required: false
    default: 'animated,still'
  cards:
    description: >-
      Comma-separated: status,abilities. `status` is the scene (character,
      horizon, four abilities); `abilities` is a taller companion sheet listing
      all eight abilities with their measures, counts and percentiles.
    required: false
    default: 'status,abilities'
  campaign:
    description: 'Year to render. Defaults to the current calendar year. The campaign is the calendar year.'
    required: false

outputs:
  character_class:
    description: 'Derived class slug (warrior, hermit, druid, ...)'
  rank:
    description: 'Derived seniority rank slug (apprentice ... archon)'
  changed:
    description: >-
      true if any output file differs from the previous run. Rendering is
      deterministic, so this is false whenever the profile has not moved.
      Do NOT use it to skip every commit: GitHub disables scheduled workflows
      after 60 days of repository inactivity, and a profile repo is exactly the
      kind that goes quiet. Commit at least weekly regardless.

runs:
  # node24, not node20: Node 20 is removed from Actions runners on
  # 2026-09-23, and runners already force node20 actions onto 24 with a
  # deprecation warning. The bundle has only ever been tested on 24.
  using: 'node24'
  # Bundled by `npm run build` (ncc). Committed so the Action needs no
  # node_modules at runtime — that is how GitHub Actions consume JS actions.
  main: 'dist-action/index.js'
