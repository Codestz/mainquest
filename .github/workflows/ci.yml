name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # A matrix rather than a single version, because package.json declares a
    # floor (engines.node) and an untested floor is a guess. 24 is what the
    # action ships on; 22 is the claim we make to contributors.
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  bundle:
    name: dist-action in lockstep with src
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Build into a TEMP directory and diff against the committed bundle.
      #
      # Building in place would overwrite the artefact under audit and destroy
      # the evidence of what was actually committed — the check would then pass
      # unconditionally.
      - name: Rebuild into a temp dir
        run: npx ncc build src/main.ts -o "$RUNNER_TEMP/bundle" --minify

      - name: Compare with the committed bundle
        run: |
          if ! diff -q "$RUNNER_TEMP/bundle/index.js" dist-action/index.js >/dev/null; then
            echo "::error::dist-action/index.js is stale. Run 'npm run build' and commit the result."
            diff <(head -c 2000 "$RUNNER_TEMP/bundle/index.js") <(head -c 2000 dist-action/index.js) || true
            exit 1
          fi
          echo "bundle is in lockstep with src/"

  # ---------------------------------------------------------------------------
  # Does the thing we ship actually run?
  #
  # `bundle` proves dist-action/index.js is in lockstep with src/. It cannot
  # prove the bundle STARTS. Everything above this job passed while the action
  # was never once executed the way a user executes it: as a step, reading
  # INPUT_* variables, writing files to a workspace.
  #
  # MAINQUEST_FIXTURE renders a built-in fixture, so this needs no token and no
  # network — which is what lets it run on a fork's pull request.
  # ---------------------------------------------------------------------------
  e2e:
    name: the action runs as a step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the action against a fixture
        uses: ./
        id: card
        env:
          MAINQUEST_FIXTURE: heavy-committer
        with:
          github_token: unused-in-fixture-mode
          outputs: e2e-out
          campaign: 2026

      - name: The outputs it promised must exist and be real SVGs
        run: |
          set -euo pipefail
          expected="card-dark.svg card-light.svg card-dark-still.svg card-light-still.svg abilities-dark.svg abilities-light.svg mainquest.state.json"
          for f in $expected; do
            test -s "e2e-out/$f" || { echo "::error::missing or empty: e2e-out/$f"; exit 1; }
          done
          for f in e2e-out/*.svg; do
            head -c 200 "$f" | grep -q '<svg' || { echo "::error::not an SVG: $f"; exit 1; }
            # A card that renders but says nothing is the failure a file-exists
            # check misses.
            grep -q 'heavy-committer' "$f" || { echo "::error::no login in $f"; exit 1; }
          done
          echo "6 cards + state, all non-empty, all SVG"

      - name: The action outputs must be set
        run: |
          set -euo pipefail
          test "${{ steps.card.outputs.character_class }}" = "berserker" \
            || { echo "::error::character_class was '${{ steps.card.outputs.character_class }}', expected berserker"; exit 1; }
          test -n "${{ steps.card.outputs.rank }}"
          echo "class=${{ steps.card.outputs.character_class }} rank=${{ steps.card.outputs.rank }}"

      - name: Rendering is deterministic — a second run changes nothing
        env:
          MAINQUEST_FIXTURE: heavy-committer
          INPUT_GITHUB_TOKEN: unused-in-fixture-mode
          INPUT_OUTPUTS: e2e-out
          INPUT_CAMPAIGN: '2026'
        run: |
          set -euo pipefail
          cp -r e2e-out e2e-before
          node dist-action/index.js
          diff -r e2e-before e2e-out
          echo "byte-identical on a second run"

  # The README's sample cards are committed, so they can go stale silently.
  samples:
    name: README samples match the renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run samples
      - name: Compare with what is committed
        run: |
          if ! git diff --quiet -- assets/; then
            echo "::error::assets/ is stale. Run 'npm run samples' and commit the result."
            git diff --stat -- assets/
            exit 1
          fi
          echo "sample cards are current"

  # ---------------------------------------------------------------------------
  # Does the DEFAULT token actually work?
  #
  # `github_token` defaults to GITHUB_TOKEN so the Action installs with no
  # secret. That rests on a claim about someone else's API — that GITHUB_TOKEN
  # can read a user's public contributionsCollection — and a claim about an
  # external service is exactly the kind that quietly stops being true.
  #
  # If GitHub ever narrows that scope, this job goes red and we find out. The
  # alternative is every new user finding out for us.
  # ---------------------------------------------------------------------------
  default-token:
    name: GITHUB_TOKEN renders a real profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render with the workflow's own token and nothing else
        uses: ./
        id: card
        with:
          # No github_token: this is the point of the job.
          username: ${{ github.repository_owner }}
          outputs: token-out
          cards: status
          motion: animated
          themes: dark

      - name: It must produce a real card and claim nothing it did not measure
        run: |
          set -euo pipefail
          test -s token-out/card-dark.svg
          grep -q '<svg' token-out/card-dark.svg
          # It must have classified a real person, not fallen back to empty.
          test -n "${{ steps.card.outputs.character_class }}"

          # The regression this job exists for.
          #
          # A caveat used to be derived from the credential type — a `ghs_`
          # token was assumed unable to read restrictedContributionsCount — and
          # a real card printed "sealed activity: 156" directly above "private
          # work not counted". No claim about what a token could or could not
          # see may appear on the artwork again.
          if grep -q 'not counted' token-out/card-dark.svg; then
            echo "::error::the card is claiming something it did not measure"
            exit 1
          fi
          echo "class=${{ steps.card.outputs.character_class }} rank=${{ steps.card.outputs.rank }}"
